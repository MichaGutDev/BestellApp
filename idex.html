<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestellApp</title>
    <link
      rel="icon"
      type="image/svg"
      href="./assets/img/burger/Chanese 1.png"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/basket.css" />
    <link rel="stylesheet" href="./styles/mobile.css" />
    <script src="./scripts/db.js"></script>
    <script src="./scripts/templates.js"></script>
    <script src="./script.js"></script>
  </head>
  <body onload="init()">
    <header class="main-header">
      <div class="main-header-content">
        <div>
          <img src="./assets/icons/takeout-dining-2.svg" alt="" />
          <img src="./assets/icons/bestell-app.svg" alt="Logo BestellApp" />
        </div>
        <img
          class="burger-menu-icon-mobil"
          src="./assets/icons/dehaze.svg"
          alt="Burger Menu Icon"
        />
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-brand-area">
          <figure class="brand-logo">
            <img src="./assets/img/logo-burger.jpg" alt="Restaurant Logo" />
          </figure>
        </div>
        <div class="brand-header">
          <h1>Burger<span class="house">House</span></h1>
          <div class="rating-badge">
            <img src="./assets/icons/star.svg" alt="star-icon" />
            <data value="4.1">4.1</data>
            <small>(117)</small>
          </div>
        </div>
        <p class="restaurant-tagline">
          Das Beste aus Burgern, Pizza und Salaten – alles an einem großartigen
          Ort.
        </p>
      </section>
      <div class="ordering-system">
        <section class="menu-selection">
          <section id="category-burgers" class="category-section">
            <header class="category-divider">
              <div class="menu-content-limit">
                <img
                  src="./assets/img/burger/Chanese 1.png"
                  alt="Burger Icon"
                />
                <h2 class="category-title-desktop">Burger & Sandwiches</h2>
                <h2 class="category-title-mobile">Burger</h2>
              </div>
            </header>
            <div class="category-content">
              <div id="burgers-list" class="dish-render-target"></div>
            </div>
          </section>
          <section id="category-pizza" class="category-section">
            <header class="category-divider">
              <div class="menu-content-limit">
                <img src="./assets/img/pizza/Pizza 1.png" alt="Pizza Icon" />
                <h2>Pizza<span class="diameter">(30cm)</span></h2>
              </div>
            </header>
            <div class="category-content">
              <div id="pizza-list" class="dish-render-target"></div>
            </div>
          </section>
          <section id="category-salads" class="category-section">
            <header class="category-divider">
              <div class="menu-content-limit">
                <img src="./assets/img/salad/Salad 1.png" alt="Salat Icon" />
                <h2>Salate</h2>
              </div>
            </header>
            <div class="category-content">
              <div id="salads-list" class="dish-render-target"></div>
            </div>
          </section>
        </section>
        <section id="basket-area" class="basket-area">
          <aside
            id="order-basket"
            class="order-basket"
            aria-labelledby="basket-title"
          >
            <button
              type="button"
              class="mobile-basket-close-btn"
              onclick="closeMobileBasket()"
              aria-label="Warenkorb schließen"
            >
              <img src="./assets/icons/close.svg" alt="" aria-hidden="true" />
            </button>
            <h3 id="basket-title">Warenkorb</h3>
            <div id="basket-list" class="basket-list"></div>
            <div id="basket-summary" class="basket-summary"></div>
            <button
              id="buy-button"
              type="button"
              class="buy-button"
              onclick="submitOrder()"
            >
              Jetzt kaufen
            </button>
          </aside>
        </section>
      </div>
      <dialog id="order-confirmation" class="order-confirmation">
        <button
          type="button"
          class="close-dialog-btn"
          onclick="closeOrderConfirmation()"
          aria-label="Dialog schließen"
        >
          <img src="./assets/icons/close.svg" alt="" aria-hidden="true" />
        </button>
        <img src="./assets/img/order-dialog.png" alt="" aria-hidden="true" />
        <h3>Bestellung bestätigt!</h3>
        <p>Dein Essen ist unterwegs!</p>
      </dialog>
    </main>
    <nav class="mobile-nav" aria-label="Mobile Navigation">
      <button type="button" class="mobile-nav-btn" aria-label="Zur Startseite">
        <img
          class="mobile-nav-icon"
          src="./assets/icons/home-white.svg"
          alt=""
          aria-hidden="true"
        />
        <img
          class="mobile-nav-icon-hover"
          src="./assets/icons/home-orange.svg"
          alt=""
          aria-hidden="true"
        />
      </button>
      <button
        type="button"
        class="mobile-nav-btn"
        aria-label="Kontakt anzeigen"
      >
        <img
          class="mobile-nav-icon"
          src="./assets/icons/person-white.svg"
          alt=""
          aria-hidden="true"
        />
        <img
          class="mobile-nav-icon-hover"
          src="./assets/icons/person-orange.svg"
          alt=""
          aria-hidden="true"
        />
      </button>
      <button type="button" class="mobile-nav-btn" aria-label="über Uns">
        <img
          class="mobile-nav-icon"
          src="./assets/icons/logo-white.svg"
          alt=""
          aria-hidden="true"
        />
        <img
          class="mobile-nav-icon-hover"
          src="./assets/icons/logo-orange.svg"
          alt=""
          aria-hidden="true"
        />
      </button>
      <button
        type="button"
        class="mobile-nav-btn mobile-basket-btn"
        onclick="toggleMobileBasket()"
        aria-label="Warenkorb öffnen"
      >
        <img
          class="mobile-nav-icon"
          src="./assets/icons/shopping-cart-white.svg"
          alt=""
          aria-hidden="true"
        />
        <img
          class="mobile-nav-icon-hover"
          src="./assets/icons/shopping-cart-orange.svg"
          alt=""
          aria-hidden="true"
        />
        <span id="mobile-basket-counter" class="mobile-basket-counter">0</span>
      </button>
    </nav>
    <footer>
      <div class="copyright">
        <img src="./assets/icons/copyright.svg" alt="copyright icon" />
        <p>2025 BurgerHouse</p>
      </div>
      <p>Imprint</p>
      <p>Cookie Preferences</p>
    </footer>
  </body>
</html>
