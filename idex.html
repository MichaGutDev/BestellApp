<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestellApp</title>
    <link rel="icon" type="image/svg" href="./assets/img/Chanese 1.png" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/variables.css" />
    <script src="./scripts/db.js"></script>
    <script src="./scripts/templates.js"></script>
    <script src="./script.js"></script>
  </head>
  <body>
    <header>
      <div>
        <img src="./assets/icons/bestell-app.svg" alt="Logo BestellApp" />
        <img src="./assets/icons/dehaze.svg" alt="Burger Menu Icon" />
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-brand-area">
          <figure class="brand-logo">
            <img src="./assets/img/logo-burger.jpg" alt="Restaurant Logo" />
          </figure>
        </div>
        <div class="brand-header">
          <h1>Burger<span>House</span></h1>
          <div class="rating-badge">
            <img src="./assets/icons/star.svg" alt="star-icon" />
            <data value="4.1">4.1</data>
            <small>(117)</small>
          </div>
        </div>
      </section>
      <div class="ordering-system">
        <section class="menu-section">
          <header></header>
        </section>
        <section></section>
        <section></section>
      </div>
    </main>
    <footer>
      <div>
        <img src="./assets/icons/copyright.svg" alt="copyright icon" />
        <p>2025 BurgerHouse</p>
      </div>
      <p>Imprint</p>
      <p>Cookie Preferences</p>
    </footer>
  </body>
</html>
